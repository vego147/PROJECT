services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketing_engine
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: change_me_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
